name: Security Audit - Dino Dash 3D

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'evolucao/**']

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check no service_role or private keys in src
        run: |
          if grep -rnE "service_role|BEGIN (RSA|EC|OPENSSH) PRIVATE KEY" src/ public/; then
            echo "Secret pattern detected in client source!"
            exit 1
          fi
